            </div>
            <p class="notice-box">${escapeHtml(t.notice)}</p>
            ${
              state.storageWarning
                ? `<p class="warn-box">${escapeHtml(lang === "ar" ? "امتلأت سعة التخزين المحلية في المتصفح بسبب حجم الصور المرفوعة. يُنصح بتحميل ملفات JSON الآن أو استخدام روابط صور خارجية." : lang === "fr" ? "Le stockage local du navigateur est plein suite aux images importées. Téléchargez les fichiers JSON ou utilisez des URLs d'images." : "Browser local storage quota reached due to uploaded images. Export your JSON files now or use image URLs.")}</p>`
                : ""
            }
          </header>

          <div class="bg-dark-ink rounded-16 p-card stack-md">
            <div class="kicker kicker-light" style="display:flex;align-items:center;gap:0.5rem;margin:0;">
              ${icon("fileText", "icon-svg")}
              <span>${escapeHtml(t.aiAssistTitle)}</span>
            </div>
            <div class="flex-row-wrap">
              <input type="text" id="admin-ai-topic" value="${escapeHtml(state.aiTopic)}" placeholder="${escapeHtml(t.aiTopicPlaceholder)}" class="input-dark" style="flex:1;min-width:220px;" />
              <button type="button" data-action="admin-ai-draft" ${state.aiLoading ? "disabled" : ""} class="btn btn-gold">
                ${state.aiLoading ? icon("loader", "icon-svg") : ""}
                <span>${escapeHtml(t.aiDraftBtn)}</span>
              </button>
            </div>
            ${state.aiError ? `<p style="font-size:0.75rem;color:#fdba74;margin:0;">${escapeHtml(state.aiError)}</p>` : ""}
          </div>

          <div class="flex-row-wrap hairline-b" style="gap:0.5rem;">
            ${tabs
              .map(
                (item) => `
                <button type="button" data-action="admin-tab" data-tab="${item.id}" class="btn-pill ${state.adminTab === item.id ? "is-active" : ""}">
                  ${escapeHtml(item.label)}
                </button>`
              )
              .join("")}
            <span id="admin-saved-badge" class="${state.savedFlag ? "" : "hidden"} text-success" style="font-size:0.75rem;font-weight:600;margin-inline-start:auto;">${escapeHtml(t.savedNotice)}</span>
          </div>

          <div id="admin-tab-body">${tabBody}</div>
        </div>
      `;
    }

    // =========================================================================
    // MODALS (NAV DRAWER, ACTIVITY DETAILS, GALLERY LIGHTBOX) & VISUAL STUDIO
    // =========================================================================
    function renderModalRoot() {
      const root = document.getElementById("modal-root");
      if (!root) return;
      const lang = state.language;
      const locale = tLocale();

      // 1. Navigation Drawer
      if (state.drawerOpen) {
        const nav = locale.nav;
        const allPages = [
          { id: "home", label: nav.home },
          { id: "about", label: nav.about },
          { id: "activities", label: nav.activities },
          { id: "events", label: nav.events },
          { id: "gallery", label: nav.gallery },
          { id: "news", label: nav.news },
          { id: "contact", label: nav.contact }
        ];
        root.innerHTML = `
          <div role="dialog" aria-modal="true" aria-label="${escapeHtml(nav.menu)}" class="drawer-backdrop" data-action="close-drawer">
            <aside class="drawer-panel" data-stop-prop="true">
              <div>
                <div class="flex-between hairline-b" style="padding-bottom:1.5rem;">
                  <span class="font-display heading-sm text-ink">${escapeHtml(state.settings.institution.name[lang])}</span>
                  <button type="button" data-action="close-drawer" class="btn btn-outline" style="padding:0.375rem 0.75rem;">
                    ${icon("x", "icon-svg")}
                    <span>${escapeHtml(nav.close)}</span>
                  </button>
                </div>

                <div class="hairline-b" style="padding-block:1.5rem;">
                  <p class="font-mono-tabular text-subtle" style="font-size:11px;letter-spacing:0.15em;margin:0 0 0.75rem;">AR · FR · EN</p>
                  <div class="grid-3" style="gap:0.5rem;">
                    ${[
                      { code: "ar", label: "العربية" },
                      { code: "fr", label: "Français" },
                      { code: "en", label: "English" }
                    ]
                      .map(
                        (l) => `
                        <button type="button" data-action="set-lang" data-lang="${l.code}" class="btn-pill ${lang === l.code ? "is-active" : ""}" style="font-weight:600;text-align:center;">
                          ${escapeHtml(l.label)}
                        </button>`
                      )
                      .join("")}
                  </div>
                </div>

                <nav style="padding-block:1.5rem;" class="stack-xs">
                  ${allPages
                    .map(
                      (p, idx) => `
                      <button type="button" data-action="nav" data-page="${p.id}" class="drawer-nav-item ${state.activePage === p.id ? "is-active" : ""}">
                        <span class="font-display heading-sm">${escapeHtml(p.label)}</span>
                        <span class="font-mono-tabular text-subtle" style="font-size:0.75rem;">${String(idx + 1).padStart(2, "0")}</span>
                      </button>`
                    )
                    .join("")}
                </nav>
              </div>

              <div class="hairline-t text-muted stack-xs" style="font-size:0.75rem;">
                <p style="font-weight:500;color:#181715;margin:0;">${escapeHtml(state.settings.contact.hours[lang])}</p>
                <p style="margin:0;">${escapeHtml(state.settings.contact.address[lang])}</p>
              </div>
            </aside>
          </div>
        `;
        syncBodyScrollLock();
        return;
      }

      // 2. Activity Details Modal
      if (state.selectedActivityId && state.activePage === "activities") {
        const act = state.activities.find((a) => a.id === state.selectedActivityId);
        const t = locale.activitiesPage;
        if (act) {
          root.innerHTML = `
            <div role="dialog" aria-modal="true" aria-label="${escapeHtml(act.title[lang])}" class="overlay-backdrop" data-action="close-activity-modal">
              <div class="modal-card" style="max-width:42rem;" data-stop-prop="true">
                <div class="media-frame aspect-16-9">
                  ${renderSafeImage(act.image, act.title[lang], "")}
                  <button type="button" data-action="close-activity-modal" aria-label="${escapeHtml(t.closeModal)}" class="btn" style="position:absolute;top:1rem;inset-inline-end:1rem;width:2.25rem;height:2.25rem;background:rgba(17,17,16,0.85);color:#fbf9f5;">
                    ${icon("x", "icon-svg")}
                  </button>
                </div>
                <div class="p-card p-card-lg stack-md" style="overflow-y:auto;">
                  <p class="kicker" style="margin:0;">${escapeHtml(act.category[lang])}</p>
                  <h2 class="font-display heading-lg" style="font-size:1.875rem;margin:0;">${escapeHtml(act.title[lang])}</h2>
                  <p class="text-muted" style="font-size:0.9375rem;line-height:1.7;margin:0;">${escapeHtml(act.details[lang])}</p>
                  <dl class="grid-3 hairline-t" style="gap:1rem;font-size:0.75rem;margin:0;">
                    <div class="stack-xs"><dt class="text-subtle" style="display:flex;align-items:center;gap:0.375rem;">${icon("calendar", "icon-sm")}<span>${escapeHtml(t.scheduleLabel)}</span></dt><dd style="margin:0;font-weight:500;color:#181715;">${escapeHtml(act.schedule[lang])}</dd></div>
                    <div class="stack-xs"><dt class="text-subtle" style="display:flex;align-items:center;gap:0.375rem;">${icon("mapPin", "icon-sm")}<span>${escapeHtml(t.spaceLabel)}</span></dt><dd style="margin:0;font-weight:500;color:#181715;">${escapeHtml(act.space[lang])}</dd></div>
                    <div class="stack-xs"><dt class="text-subtle" style="display:flex;align-items:center;gap:0.375rem;">${icon("user", "icon-sm")}<span>${escapeHtml(t.mentorLabel)}</span></dt><dd style="margin:0;font-weight:500;color:#181715;">${escapeHtml(act.mentor)}</dd></div>
                  </dl>
                  <div class="flex-row-wrap" style="padding-top:0.5rem;">
                    <button type="button" data-action="inquire-activity" class="btn btn-dark">${escapeHtml(t.inquireBtn)}</button>
                    <button type="button" data-action="close-activity-modal" class="btn btn-outline">${escapeHtml(t.closeModal)}</button>
                  </div>
                </div>
              </div>
            </div>
          `;
          syncBodyScrollLock();
          return;
        }
      }

      // 3. Gallery Lightbox
      if (state.lightboxIdx !== null && state.activePage === "gallery") {
        const visible = state.galleryAlbum === "all" ? state.gallery : state.gallery.filter((g) => g.categoryKey === state.galleryAlbum);
        const item = visible[state.lightboxIdx];
        if (item) {
          root.innerHTML = `
            <div class="lightbox-overlay" data-action="close-lightbox">
              <div class="flex-between" data-stop-prop="true">
                <span class="font-mono-tabular text-gold-light" style="font-size:0.75rem;">${escapeHtml(locale.galleryPage.lightboxCounter)} ${state.lightboxIdx + 1} / ${visible.length}</span>
                <button type="button" data-action="close-lightbox" class="lightbox-icon-btn" aria-label="Close">${icon("x", "icon-md")}</button>
              </div>
              <div dir="ltr" style="flex:1;display:flex;align-items:center;justify-content:center;gap:1rem;margin-block:1rem;overflow:hidden;" data-stop-prop="true">
                <button type="button" data-action="lightbox-prev" class="lightbox-icon-btn" aria-label="Previous">${icon("chevronLeft", "icon-md")}</button>
                <div class="lightbox-img-stage" style="max-height:75vh;max-width:56rem;overflow:hidden;border-radius:12px;">
                  ${renderSafeImage(item.image, item.title[lang], "")}
                </div>
                <button type="button" data-action="lightbox-next" class="lightbox-icon-btn" aria-label="Next">${icon("chevronRight", "icon-md")}</button>
              </div>
              <div style="text-align:center;max-width:42rem;margin-inline:auto;" class="stack-xs" data-stop-prop="true">
                <p class="font-display heading-md" style="color:#fbf9f5;margin:0;">${escapeHtml(item.title[lang])}</p>
                <p style="font-size:0.75rem;color:rgba(251,249,245,0.75);margin:0;">${escapeHtml(item.caption[lang])}</p>
              </div>
            </div>
          `;
          syncBodyScrollLock();
          return;
        }
      }

      root.innerHTML = "";
      syncBodyScrollLock();
    }

    function getVeTargetTitle(target, lang) {
      switch (target.kind) {
        case "ui": return `${target.section}.${target.field}`;
        case "highlight": return lang === "ar" ? `شهادة مجتمعية #${target.index + 1}` : lang === "fr" ? `Témoignage #${target.index + 1}` : `Testimonial #${target.index + 1}`;
        case "settingsField": return `settings.${target.field}`;
        case "metric": return lang === "ar" ? "تعديل مؤشر إحصائي" : "Edit Metric";
        case "aboutField": return `about.${target.field}`;
        case "aboutValue": return lang === "ar" ? `قيمة مؤسساتية #${target.index + 1}` : `Guiding Value #${target.index + 1}`;
        case "aboutOrg": return lang === "ar" ? `عنصر الهيكلة #${target.index + 1}` : `Org Structure #${target.index + 1}`;
        case "activity": return lang === "ar" ? "تعديل بطاقة نشاط" : lang === "fr" ? "Modifier l'activité" : "Edit Activity";
        case "event": return lang === "ar" ? "تعديل فعالية" : lang === "fr" ? "Modifier l'événement" : "Edit Event";
        case "news": return lang === "ar" ? "تعديل مقال إخباري" : lang === "fr" ? "Modifier l'actualité" : "Edit News";
        case "fbFeedSection": return lang === "ar" ? "عنصر آخر منشورات فيسبوك" : lang === "fr" ? "Section Publications Facebook" : "Facebook Posts Element";
        case "fbPost": return lang === "ar" ? "تعديل أو حذف منشور فيسبوك" : lang === "fr" ? "Modifier / Supprimer publication Facebook" : "Edit / Delete Facebook Post";
        case "gallery": return lang === "ar" ? "تعديل عنصر معرض" : lang === "fr" ? "Modifier la galerie" : "Edit Gallery Item";
        default: return "Edit";
      }
    }

    function renderVeStyleAndPositionControls(target) {
      const lang = state.language;
      const veKey = getVeTargetKey(target);
      const cur = state.settings.elementStyles?.[veKey] || {};
      const curColor = cur.color || "#181715";
      const curX = Number(cur.x) || 0;
      const curY = Number(cur.y) || 0;
      const swatches = ["#181715", "#5c5852", "#b08d57", "#d4b886", "#fbf9f5", "#9a3412", "#14532d", "#1e3a8a"];

      const isReorderable = ["activity", "event", "news", "fbPost", "gallery", "metric", "highlight", "aboutValue", "aboutOrg"].includes(target.kind);

      return `
        <div class="hairline-t stack-md" style="margin-top:1.25rem;padding-top:1rem;">
          <div style="padding:0.875rem;border-radius:12px;background:#f3efe7;border:1px solid rgba(24,23,21,0.1);" class="stack-sm">
            <div class="flex-between">
              <span style="display:inline-flex;align-items:center;gap:0.4rem;font-size:0.75rem;font-weight:600;color:#181715;">
                ${icon("palette", "icon-sm text-gold")}
                <span>${escapeHtml(lang === "ar" ? "لون نص هذا العنصر" : lang === "fr" ? "Couleur du texte" : "Element Text Color")}</span>
              </span>
              ${
                cur.color
                  ? `<button type="button" data-action="ve-reset-color" data-ve-key="${escapeHtml(veKey)}" class="btn btn-outline" style="padding:0.2rem 0.55rem;font-size:11px;">${escapeHtml(lang === "ar" ? "إعادة اللون" : "Reset Color")}</button>`
                  : ""
              }
            </div>
            <div class="flex-row-wrap" style="gap:0.4rem;">
              <input type="color" value="${escapeHtml(curColor)}" data-ve-color-input="${escapeHtml(veKey)}" style="width:34px;height:28px;padding:0;border:1px solid rgba(24,23,21,0.2);border-radius:6px;cursor:pointer;background:transparent;" />
              ${swatches
                .map(
                  (hex) => `<button type="button" data-action="ve-set-color" data-ve-key="${escapeHtml(veKey)}" data-color="${hex}" aria-label="${hex}" style="width:24px;height:24px;border-radius:6px;background:${hex};border:2px solid ${cur.color === hex ? "#b08d57" : "rgba(24,23,21,0.2)"};"></button>`
                )
                .join("")}
            </div>
          </div>

          <div style="padding:0.875rem;border-radius:12px;background:#f3efe7;border:1px solid rgba(24,23,21,0.1);" class="stack-sm">
            <div class="flex-between">
              <span style="display:inline-flex;align-items:center;gap:0.4rem;font-size:0.75rem;font-weight:600;color:#181715;">
                ${icon("move", "icon-sm text-gold")}
                <span>${escapeHtml(lang === "ar" ? "تحريك وتغيير مكان العنصر" : lang === "fr" ? "Déplacer l'élément" : "Reposition Element (X / Y)")}</span>
              </span>
              ${
                curX !== 0 || curY !== 0
                  ? `<button type="button" data-action="ve-reset-pos" data-ve-key="${escapeHtml(veKey)}" class="btn btn-outline" style="padding:0.2rem 0.55rem;font-size:11px;">${escapeHtml(lang === "ar" ? "إعادة المكان" : "Reset Pos")}</button>`
                  : ""
              }
            </div>
            <div class="flex-row-wrap" style="gap:0.5rem;">
              <label style="display:inline-flex;align-items:center;gap:0.35rem;font-size:11px;">
                <span class="font-mono-tabular text-muted">X</span>
                <input type="number" step="4" value="${curX}" data-ve-pos-axis="x" data-ve-key="${escapeHtml(veKey)}" class="input-field font-mono-tabular" style="width:4.75rem;padding:0.3rem 0.45rem;" />
              </label>
              <label style="display:inline-flex;align-items:center;gap:0.35rem;font-size:11px;">
                <span class="font-mono-tabular text-muted">Y</span>
                <input type="number" step="4" value="${curY}" data-ve-pos-axis="y" data-ve-key="${escapeHtml(veKey)}" class="input-field font-mono-tabular" style="width:4.75rem;padding:0.3rem 0.45rem;" />
              </label>
              <div dir="ltr" style="display:inline-flex;align-items:center;gap:0.25rem;margin-inline-start:auto;">

    // =========================================================================
    // MASTER SHELL RENDERER (PRESERVING 3D WEBGL SCENE WHENEVER POSSIBLE)
    // =========================================================================
    function renderActivePageHtml() {
      switch (state.activePage) {
        case "home": return renderHomeView();
        case "about": return renderAboutView();
        case "activities": return renderActivitiesView();
        case "events": return renderEventsView();
        case "gallery": return renderGalleryView();
        case "news": return renderNewsView();
        case "contact": return renderContactView();
        case "admin": return state.adminUnlocked ? renderAdminView() : renderHomeView();
        default: return renderHomeView();
      }
    }

    function syncBodyScrollLock() {
      const hasModal =
        Boolean(state.drawerOpen) ||
        Boolean(state.selectedActivityId && state.activePage === "activities") ||
        Boolean(state.lightboxIdx !== null && state.activePage === "gallery") ||
        Boolean(state.adminUnlocked && state.visualEditMode && state.activePage !== "admin" && state.activeVeTarget);
      document.body.style.overflow = hasModal ? "hidden" : "";
    }

    function renderShell({ preserve3D = true } = {}) {
      const appRoot = document.getElementById("app-root");
      if (!appRoot) return;

      syncDocumentLanguage();
      const isVe = state.visualEditMode && state.activePage !== "admin";
      appRoot.className = isVe
        ? `site-shell visual-edit-active${state.veDragMode && !state.browseOverride ? " ve-drag-mode" : ""}`
        : "site-shell";

      // Preserve live Three.js canvas element when updating home view (e.g. language or visual edits)
      const existingCanvasWrap = preserve3D && state.activePage === "home" ? document.getElementById("model3d-canvas-mount") : null;
      let detachedCanvasWrap = null;
      if (existingCanvasWrap && existingCanvasWrap.childElementCount > 0) {
        detachedCanvasWrap = existingCanvasWrap;
        detachedCanvasWrap.parentNode?.removeChild(detachedCanvasWrap);
      } else if (model3dRuntime.cleanup) {
        model3dRuntime.cleanup();
        model3dRuntime.cleanup = null;
      }

      appRoot.innerHTML = `
        <div class="sticky-top-stack">
          ${renderNavbar()}
          ${state.adminUnlocked && isVe ? renderVeTopRibbonHtml() : ""}

        <main id="main-content">${renderActivePageHtml()}</main>
        ${renderFooter()}
      `;

      if (state.activePage === "home") {
        if (detachedCanvasWrap) {
          const freshMount = document.getElementById("model3d-canvas-mount");
          if (freshMount?.parentNode) {
            freshMount.parentNode.replaceChild(detachedCanvasWrap, freshMount);
          }
        } else {
          const mount = document.getElementById("model3d-canvas-mount");
          if (mount) {
            mountModel3D(mount, syncModel3DOverlayOnly);
          }
        }
      }

      applyElementStyles(appRoot);
      renderModalRoot();
      renderVisualOverlay();
      syncBodyScrollLock();
      initRevealObserver();
      initAnimatedCounters();
    }

    // =========================================================================
    // DEEP PATH DATA BINDING FOR LIVE EDITING WITHOUT INPUT FOCUS LOSS
    // =========================================================================
    function applyDataBind(bindPath, value, coerceType) {
      const val = coerceType === "number" ? Number(value) || 0 : value;
      const parts = bindPath.split(".");

      if (parts[0] === "ve" && parts[1] === "ui") {
        const [, , section, field, langKey] = parts;
        const next = structuredClone(state.uiStrings);
        if (!next[langKey][section]) next[langKey][section] = {};
        next[langKey][section][field] = val;
        updateUiStrings(next);
        return "live-page";
      }

      if (parts[0] === "uiStrings") {
        const [, lc, sec, a, b] = parts;
        const next = structuredClone(state.uiStrings);
        if (sec === "highlights") {
          const idx = Number(a);
          if (next[lc].highlights[idx]) next[lc].highlights[idx][b] = val;
        } else {
          if (!next[lc][sec]) next[lc][sec] = {};
          next[lc][sec][a] = val;
        }
        updateUiStrings(next);
        return "live-page";
      }

      const rootName = parts[0];
      let targetObj =
        rootName === "settings" ? structuredClone(state.settings)
        : rootName === "about" ? structuredClone(state.about)
        : rootName === "activities" ? structuredClone(state.activities)
        : rootName === "events" ? structuredClone(state.events)
        : rootName === "news" ? structuredClone(state.news)
        : rootName === "fbNews" ? structuredClone(state.fbNews)
        : rootName === "gallery" ? structuredClone(state.gallery)
        : rootName === "newsDraft" ? state.newsDraft
        : rootName === "newEvent" ? state.newEvent
        : rootName === "newActivity" ? state.newActivity
        : rootName === "newGallery" ? state.newGallery
        : null;

      if (!targetObj) return null;

      let cursor = targetObj;
      for (let i = 1; i < parts.length - 1; i++) {
        const k = parts[i];
        cursor = Array.isArray(cursor) ? cursor[Number(k)] : cursor[k];
        if (!cursor) return null;
      }
      const lastKey = parts[parts.length - 1];
      if (Array.isArray(cursor)) cursor[Number(lastKey)] = val;
      else cursor[lastKey] = val;

      if (bindPath === "settings.facebookFeed.pageUrl" && String(val || "").trim() !== String(state.settings?.facebookFeed?.pageUrl || "").trim()) {
        state.fbNews = [];
        state.fbPageName = "";
        removeLocalKeys([FB_CACHE_STORAGE]);
      }

      if (rootName === "settings") updateSettings(targetObj);
      else if (rootName === "about") updateAbout(targetObj);
      else if (rootName === "activities") updateActivities(targetObj);
      else if (rootName === "events") updateEvents(targetObj);
      else if (rootName === "news") updateNews(targetObj);
      else if (rootName === "fbNews") {
        const editedIdx = Number(parts[1]);
        if (Number.isInteger(editedIdx) && targetObj[editedIdx]) {
          targetObj[editedIdx].editedLocally = true;
        }
        updateFbNews(targetObj);
      }
      else if (rootName === "gallery") updateGallery(targetObj);
      else return "draft";

      return "live-page";
    }

    function updateImageControlUrl(bindKey, nextUrl) {
      applyDataBind(bindKey, nextUrl, "string");
      // Update inline preview cleanly for ONLY this exact bindKey
      document.querySelectorAll(`[data-image-control="${CSS.escape(bindKey)}"]`).forEach((ctrl) => {
        const thumb = ctrl.querySelector(".admin-preview-thumb");
        if (thumb) thumb.innerHTML = renderSafeImage(nextUrl, "Preview", "");
        const urlInput = ctrl.querySelector("[data-img-url]");
        if (urlInput && document.activeElement !== urlInput) {
          urlInput.value = nextUrl.startsWith("data:") ? "" : nextUrl;
        }
        const presetSel = ctrl.querySelector("[data-img-preset]");
        if (presetSel) {
          presetSel.value = BUNDLED_PRESETS.some((p) => p.path === nextUrl) ? nextUrl : "";
        }
      });
      if (state.activeVeTarget) {
        refreshBackgroundShellOnly();
      } else {
        flashAdminSaved();
      }
    }

    function refreshBackgroundShellOnly() {
      const appRoot = document.getElementById("app-root");
      if (!appRoot) return;
      syncDocumentLanguage();
      const detachedCanvasWrap = state.activePage === "home" ? document.getElementById("model3d-canvas-mount") : null;
      if (detachedCanvasWrap) detachedCanvasWrap.parentNode?.removeChild(detachedCanvasWrap);

      const isVe = state.visualEditMode && state.activePage !== "admin";
      appRoot.className = isVe
        ? `site-shell visual-edit-active${state.veDragMode && !state.browseOverride ? " ve-drag-mode" : ""}`
        : "site-shell";
      appRoot.innerHTML = `
        <div class="sticky-top-stack">
          ${renderNavbar()}
          ${state.adminUnlocked && isVe ? renderVeTopRibbonHtml() : ""}
        </div>
        <main id="main-content">${renderActivePageHtml()}</main>
        ${renderFooter()}
      `;

      if (state.activePage === "home" && detachedCanvasWrap) {
        const freshMount = document.getElementById("model3d-canvas-mount");
        if (freshMount?.parentNode) freshMount.parentNode.replaceChild(detachedCanvasWrap, freshMount);
      }
      applyElementStyles(appRoot);
      appRoot.querySelectorAll(".reveal-section").forEach((s) => s.classList.add("is-visible"));
    }

    // =========================================================================
    // EVENT DELEGATION & LIFECYCLE
    // =========================================================================
    async function handleGeminiSubmit() {
      const g = state.gemini;
      if (!g.prompt.trim() || g.loading) return;
      g.loading = true;
      g.error = null;
      g.answer = "";
      g.sources = [];
      g.places = [];
      const hub = document.getElementById("gemini-hub-box");
      if (hub) hub.outerHTML = renderGeminiHubHtml();

      try {
        if (g.mode === "think") {
          const res = await callGeminiThink(g.prompt, state.language);
          g.answer = res.text || "";
        } else if (g.mode === "search") {
          const res = await callGeminiSearch(g.prompt, state.language);
          g.answer = res.text || "";
          g.sources = res.sources || [];
        } else {
          const res = await callGeminiMaps(g.prompt, state.language, g.coords);
          g.answer = res.text || "";
          g.places = res.places || [];
        }
      } catch (err) {
        g.error = err instanceof Error ? err.message : "Unable to complete request.";
      } finally {
        g.loading = false;
        const freshHub = document.getElementById("gemini-hub-box");
        if (freshHub) freshHub.outerHTML = renderGeminiHubHtml();
      }
    }

    function handleFooterSecretTap(e) {
      const now = Date.now();
      if (now - state.footerTap.lastAt > 2000) {
        state.footerTap = { count: 1, lastAt: now };
      } else {
        state.footerTap = { count: state.footerTap.count + 1, lastAt: now };
      }
      if ((e && e.detail >= 3) || state.footerTap.count >= 3) {
        state.footerTap = { count: 0, lastAt: 0 };
        try { window.getSelection?.()?.removeAllRanges?.(); } catch {}
        state.adminUnlocked = true;
        state.visualEditMode = false;
        state.browseOverride = false;
        state.activeVeTarget = null;
        state.activePage = "admin";
        renderShell({ preserve3D: false });
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: "auto" });
      }
    }

    document.addEventListener("error", (e) => {
      const img = e.target;
      if (!(img instanceof HTMLImageElement) || img.dataset.safeImg !== "true") return;
      const alt = img.getAttribute("alt") || "";
      const wrapper = document.createElement("div");
      wrapper.setAttribute("role", "img");
      wrapper.setAttribute("aria-label", alt);
      wrapper.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ebe6df;color:#5c5852;padding:1.5rem;text-align:center;width:100%;height:100%;";
      wrapper.innerHTML = `${icon("landmark", "icon-lg text-gold")}<span style="font-size:0.75rem;margin-top:0.5rem;max-width:200px;line-height:1.5;"></span>`;
      wrapper.querySelector("span").textContent = alt;
      img.replaceWith(wrapper);
    }, true);

    let veDragJustMoved = false;
    let activeVeDrag = null;

    document.addEventListener("pointerdown", (e) => {
      if (!state.adminUnlocked || !state.visualEditMode || !state.veDragMode || state.browseOverride || state.activePage === "admin" || state.activeVeTarget) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      const targetEl = e.target;
      if (!(targetEl instanceof Element) || targetEl.closest(".ve-studio-chrome")) return;
      const editableEl = targetEl.closest("[data-ve-target][data-ve-key]");
      if (!(editableEl instanceof HTMLElement)) return;
      const veKey = editableEl.getAttribute("data-ve-key");
      if (!veKey) return;
      const cur = state.settings.elementStyles?.[veKey] || {};
      activeVeDrag = {
        el: editableEl,
        veKey,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        baseX: Number(cur.x) || 0,
        baseY: Number(cur.y) || 0,
        lastX: Number(cur.x) || 0,
        lastY: Number(cur.y) || 0,
        moved: false
      };
    }, { capture: true });

    document.addEventListener("pointermove", (e) => {
      if (!activeVeDrag || e.pointerId !== activeVeDrag.pointerId) return;
      const dx = e.clientX - activeVeDrag.startX;
      const dy = e.clientY - activeVeDrag.startY;
      if (!activeVeDrag.moved && Math.hypot(dx, dy) < 4) return;
      activeVeDrag.moved = true;
      activeVeDrag.el.classList.add("is-dragging");
      if (getComputedStyle(activeVeDrag.el).position === "static") {
        activeVeDrag.el.style.position = "relative";
      }
      activeVeDrag.lastX = Math.round(activeVeDrag.baseX + dx);
      activeVeDrag.lastY = Math.round(activeVeDrag.baseY + dy);
      if (typeof CSS !== "undefined" && CSS.supports?.("translate", "0px 0px")) {
        activeVeDrag.el.style.translate = `${activeVeDrag.lastX}px ${activeVeDrag.lastY}px`;
      } else {
        activeVeDrag.el.style.transform = `translate3d(${activeVeDrag.lastX}px, ${activeVeDrag.lastY}px, 0)`;
      }
    });

    const finishVeDrag = (e) => {
      if (!activeVeDrag || (e.pointerId !== undefined && e.pointerId !== activeVeDrag.pointerId)) return;
      const drag = activeVeDrag;
      activeVeDrag = null;
      drag.el.classList.remove("is-dragging");
      if (drag.moved) {
        veDragJustMoved = true;
        window.setTimeout(() => { veDragJustMoved = false; }, 120);
        const next = structuredClone(state.settings);
        if (!next.elementStyles) next.elementStyles = {};
        next.elementStyles[drag.veKey] = {
          ...(next.elementStyles[drag.veKey] || {}),
          x: drag.lastX,
          y: drag.lastY
        };
        updateSettings(next);
      }
    };
    document.addEventListener("pointerup", finishVeDrag);
    document.addEventListener("pointercancel", finishVeDrag);

    // Visual Click-to-Edit capture interceptor
    document.addEventListener("click", (e) => {
      if (!state.visualEditMode || state.browseOverride || state.activePage === "admin") return;
      if (veDragJustMoved) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        return;
      }
      const targetEl = e.target;
      if (!(targetEl instanceof Element)) return;
      if (targetEl.closest(".ve-inline-action")) return;
      if (targetEl.closest(".ve-studio-chrome")) return;
      const editableEl = targetEl.closest("[data-ve-target]");
      if (!editableEl) return;
      const raw = editableEl.getAttribute("data-ve-target");
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        state.activeVeTarget = parsed;
        renderVisualOverlay();
      } catch {
        // Ignore malformed
      }
    }, { capture: true });

    document.addEventListener("dragover", (e) => {
      if (state.activePage !== "admin") return;
      const target = e.target;
      if (!(target instanceof Element)) return;
      const sec = target.closest("#model-3d");
      if (sec) {
        e.preventDefault();
        sec.classList.add("is-drop-active");
      }
    });
    document.addEventListener("dragleave", (e) => {
      if (state.activePage !== "admin") return;
      const target = e.target;
      if (!(target instanceof Element)) return;
      const sec = target.closest("#model-3d");
      if (sec && !sec.contains(e.relatedTarget)) {
        sec.classList.remove("is-drop-active");
      }
    });
    document.addEventListener("drop", (e) => {
      if (state.activePage !== "admin") return;
      const target = e.target;
      if (!(target instanceof Element)) return;
      const sec = target.closest("#model-3d");
      if (!sec) return;
      e.preventDefault();
      sec.classList.remove("is-drop-active");
      const file = e.dataTransfer?.files?.[0];
      if (file) handleGlbFileUpload(file);
    });

    document.addEventListener("click", async (e) => {
      const el = e.target;
      if (!(el instanceof Element)) return;

      if (el.closest("[data-prevent-nav='true']")) {
        e.preventDefault();
      }

      const actionEl = el.closest("[data-action]");
      if (!actionEl) {
        if (el.closest("footer.site-footer") && !el.closest("button, a, input, textarea, select")) {
          handleFooterSecretTap(e);
        }
        return;
      }
      const action = actionEl.getAttribute("data-action");

      switch (action) {
        case "nav":
          state.selectedArticleId = null;
          state.selectedActivityId = null;
          navigateTo(actionEl.getAttribute("data-page") || "home");
          break;
        case "open-drawer":
          state.drawerOpen = true;
          renderModalRoot();
          break;
        case "close-drawer":
          if (actionEl.classList.contains("drawer-backdrop") && el.closest("[data-stop-prop='true']")) return;
          state.drawerOpen = false;
          renderModalRoot();
          break;
        case "set-lang":
          state.language = actionEl.getAttribute("data-lang") || "ar";
          renderShell({ preserve3D: true });
          break;
        case "scroll-to-3d":
          document.getElementById("model-3d")?.scrollIntoView({ behavior: "smooth" });
          break;
        case "3d-trigger-upload":
          document.getElementById("model3d-file-input")?.click();
          break;
        case "3d-toggle-settings":
          model3dRuntime.settingsOpen = !model3dRuntime.settingsOpen;
          syncModel3DOverlayOnly();
          break;
        case "3d-toggle-rotate": {
          const next = structuredClone(state.settings);
          next.model3d = { ...(next.model3d || DEFAULT_SETTINGS.model3d), autoRotate: !next.model3d?.autoRotate };
          updateSettings(next);
          model3dRuntime.applyVisualSettings?.();
          if (state.activePage === "admin") renderShell({ preserve3D: false });
          else syncModel3DOverlayOnly();
          break;
        }
        case "3d-toggle-anim": {
          const next = structuredClone(state.settings);
          next.model3d = { ...(next.model3d || DEFAULT_SETTINGS.model3d), playAnimations: next.model3d?.playAnimations === false };
          updateSettings(next);
          model3dRuntime.applyVisualSettings?.();
          if (state.activePage === "admin") renderShell({ preserve3D: false });
          else syncModel3DOverlayOnly();
          break;
        }
        case "3d-bg": {
          const bgTheme = actionEl.getAttribute("data-bg") || "dark";
          const next = structuredClone(state.settings);
          next.model3d = { ...(next.model3d || DEFAULT_SETTINGS.model3d), bgTheme };
          updateSettings(next);
          model3dRuntime.applyVisualSettings?.();
          if (state.activePage === "admin") renderShell({ preserve3D: false });
          else syncModel3DOverlayOnly();
          break;
        }
        case "3d-reset-cam":
          model3dRuntime.resetCamera?.();
          break;
        case "3d-zoom-in":
          model3dRuntime.zoomBy?.(0.8);
          break;
        case "3d-zoom-out":
          model3dRuntime.zoomBy?.(1.25);
          break;
        case "3d-rot-left":
          model3dRuntime.rotateStep?.(0.45);
          break;
        case "3d-rot-right":
          model3dRuntime.rotateStep?.(-0.45);
          break;

          const next = structuredClone(state.settings);
          if (!next.elementStyles) next.elementStyles = {};
          next.elementStyles[veKey] = { ...(next.elementStyles[veKey] || {}), [vePosAxis]: Number(target.value) || 0 };
          updateSettings(next);
          refreshBackgroundShellOnly();
        }
        return;
      }
      if (target.id === "gemini-prompt-input") {
        state.gemini.prompt = target.value;
        return;
      }
      if (target.id === "contact-name") { state.contactForm.name = target.value; return; }
      if (target.id === "contact-email") { state.contactForm.email = target.value; return; }
      if (target.id === "contact-subject") { state.contactForm.subject = target.value; return; }
      if (target.id === "contact-message") { state.contactForm.message = target.value; return; }
      if (target.id === "admin-ai-topic") { state.aiTopic = target.value; return; }
      if (target.id === "admin-ui-search") {
        state.adminSearchQuery = target.value;
        const wrap = document.getElementById("admin-ui-sections-list");
        if (wrap) {
          const temp = document.createElement("div");
          temp.innerHTML = renderInterfaceTextsEditorHtml();
          const newList = temp.querySelector("#admin-ui-sections-list");
          if (newList) wrap.replaceWith(newList);
        }
        return;
      }

      const imgUrlKey = target.getAttribute("data-img-url");
      if (imgUrlKey) {
        updateImageControlUrl(imgUrlKey, target.value);
        return;
      }

      const bindPath = target.getAttribute("data-bind");
      if (bindPath) {
        const res = applyDataBind(bindPath, target.value, target.getAttribute("data-type") || "string");
        if (res === "live-page") {
          if (state.activeVeTarget) refreshBackgroundShellOnly();
          else flashAdminSaved();
        }
      }
    });

    document.addEventListener("change", async (e) => {
      const target = e.target;
      if (!(target instanceof HTMLInputElement || target instanceof HTMLSelectElement)) return;

      if (target.id === "model3d-file-input" && target instanceof HTMLInputElement && target.files?.[0]) {
        const file = target.files[0];
        target.value = "";
        await handleGlbFileUpload(file);
        return;
      }

      const presetKey = target.getAttribute("data-img-preset");
      if (presetKey && target.value) {
        updateImageControlUrl(presetKey, target.value);
        return;
      }

      const fileKey = target.getAttribute("data-img-file");
      if (fileKey && target instanceof HTMLInputElement && target.files?.[0]) {
        try {
          const dataUrl = await fileToOptimizedDataUrl(target.files[0]);
          updateImageControlUrl(fileKey, dataUrl);
        } catch {
          // Ignore unreadable image file
        }
        target.value = "";
        return;
      }

      const bindPath = target.getAttribute("data-bind");
      if (bindPath && target instanceof HTMLSelectElement) {
        applyDataBind(bindPath, target.value, "string");
        if (state.activeVeTarget) refreshBackgroundShellOnly();
        else flashAdminSaved();
      }
    });

    document.addEventListener("submit", (e) => {
      const form = e.target;
      if (!(form instanceof HTMLFormElement)) return;
      const action = form.getAttribute("data-action");
      if (!action) return;
      e.preventDefault();

      if (action === "gemini-submit") {
        handleGeminiSubmit();
        return;
      }
      if (action === "contact-submit") {
        const cf = state.contactForm;
        if (!cf.name.trim() || !cf.email.trim() || !cf.message.trim()) return;
        const prev = readLocalJson("mjm_contact_messages", []);
        writeLocalJson("mjm_contact_messages", [
          ...prev,
          { name: cf.name.trim(), email: cf.email.trim(), subject: cf.subject.trim(), message: cf.message.trim(), date: new Date().toISOString() }
        ]);
        state.contactForm = { name: "", email: "", subject: "", message: "", submitted: true };
        renderShell({ preserve3D: false });
        return;
      }
      if (action === "admin-save-settings") {
        updateSettings(state.settings);
        flashAdminSaved();
        return;
      }
      if (action === "admin-save-about") {
        updateAbout(state.about);
        flashAdminSaved();
        return;
      }
      if (action === "admin-add-news") {
        const d = state.newsDraft;
        if (!d.title_ar && !d.title_fr && !d.title_en) return;
        const entry = {
          id: `news-${Date.now()}`,
          date: new Date().toISOString().slice(0, 10),
          category: { ar: "إعلان محلي", fr: "Annonce Locale", en: "Local Announcement" },
          readTime: "2 min",
          title: { ar: d.title_ar || d.title_en || d.title_fr, fr: d.title_fr || d.title_en || d.title_ar, en: d.title_en || d.title_fr || d.title_ar },
          summary: { ar: d.summary_ar || d.summary_en, fr: d.summary_fr || d.summary_en, en: d.summary_en || d.summary_fr },
          body: { ar: d.summary_ar || d.summary_en, fr: d.summary_fr || d.summary_en, en: d.summary_en || d.summary_fr },
          image: d.image || "/src/assets/images/event_cultural_forum_1794615114219.jpg"
        };
        updateNews([entry, ...state.news]);
        state.newsDraft = { title_ar: "", title_fr: "", title_en: "", summary_ar: "", summary_fr: "", summary_en: "", image: "/src/assets/images/event_cultural_forum_1794615114219.jpg" };
        flashAdminSaved();
        renderShell({ preserve3D: false });
        return;
      }
      if (action === "admin-add-event") {
        const ne = state.newEvent;
        if (!ne.title.trim()) return;
        const item = {
          id: `evt-${Date.now()}`,
          status: "upcoming",
          date: ne.date,
          time: "14:00 – 17:00",
          location: state.settings.contact.address,
          category: { ar: "موعد جديد", fr: "Nouveau Rendez-vous", en: "New Gathering" },
          title: { ar: ne.title, fr: ne.title, en: ne.title },
          description: { ar: "[حدث مضاف عبر لوحة الإدارة المحلية]", fr: "[Événement ajouté via l'administration locale]", en: "[Event added via Local Studio Admin]" },
          registrationNote: { ar: "التسجيل مفتوح محلياً.", fr: "Inscription ouverte localement.", en: "Open local registration." },
          image: ne.image || "/src/assets/images/hero_masra_pavilion_1794615113578.jpg"
        };
        updateEvents([item, ...state.events]);
        state.newEvent.title = "";
        flashAdminSaved();
        renderShell({ preserve3D: false });
        return;
      }
      if (action === "admin-add-activity") {
        const na = state.newActivity;
        if (!na.title.trim()) return;
        const item = {
          id: `act-${Date.now()}`,
          categoryKey: na.categoryKey,
          category: { ar: "نشاط جديد", fr: "Nouvelle Activité", en: "New Activity" },
          title: { ar: na.title, fr: na.title, en: na.title },
          summary: { ar: "وصف مختصر قابل للتعديل للنشاط.", fr: "Résumé modifiable de l'activité.", en: "Editable summary for this studio activity." },
          details: { ar: "تفاصيل البرنامج التكويني والتأطيري القابلة للتعديل.", fr: "Détails du programme et de l'atelier modifiables.", en: "Editable curriculum details and workshop format." },
          schedule: { ar: "أسبوعياً · [توقيت قابل للتعديل]", fr: "Hebdomadaire · [Horaire]", en: "Weekly · [Schedule]" },
          space: { ar: "فضاء الورشات", fr: "Atelier dédié", en: "Studio Space" },
          mentor: "[Facilitator — Editable]",
          image: na.image
        };
        updateActivities([item, ...state.activities]);
        state.newActivity.title = "";
        state.expandedActivityId = item.id;
        flashAdminSaved();
        renderShell({ preserve3D: false });
        return;
      }
      if (action === "admin-add-gallery") {
        const ng = state.newGallery;
        if (!ng.title.trim()) return;
        const nextItem = {
          id: `gal-${Date.now()}`,
          categoryKey: "architecture",
          category: { ar: "إضافة محلية", fr: "Ajout Local", en: "Local Addition" },
          title: { ar: ng.title, fr: ng.title, en: ng.title },
          caption: { ar: ng.title, fr: ng.title, en: ng.title },
          aspect: "landscape",
          image: ng.image || "/src/assets/images/gallery_courtyard_detail_1794615114519.jpg"
        };
        updateGallery([nextItem, ...state.gallery]);
        state.newGallery.title = "";
        flashAdminSaved();
        renderShell({ preserve3D: false });
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        const el = e.target;
        if (el instanceof Element && el.getAttribute("role") === "button") {
          const act = el.getAttribute("data-action");
          if (act === "select-activity" || act === "select-article" || act === "open-lightbox") {
            e.preventDefault();
            el.click();
            return;
          }
        }
      }

      if (e.key === "Escape") {
        if (state.activeVeTarget) { state.activeVeTarget = null; renderVisualOverlay(); return; }
        if (state.lightboxIdx !== null) { state.lightboxIdx = null; renderModalRoot(); return; }
        if (state.selectedActivityId) { state.selectedActivityId = null; renderModalRoot(); return; }
        if (state.drawerOpen) { state.drawerOpen = false; renderModalRoot(); return; }
      }

      if (state.lightboxIdx !== null && state.activePage === "gallery") {
        const vis = state.galleryAlbum === "all" ? state.gallery : state.gallery.filter((g) => g.categoryKey === state.galleryAlbum);
        if (vis.length) {
          if (e.key === "ArrowRight") {
            state.lightboxIdx = (state.lightboxIdx + 1) % vis.length;
            renderModalRoot();
          } else if (e.key === "ArrowLeft") {
            state.lightboxIdx = (state.lightboxIdx - 1 + vis.length) % vis.length;
            renderModalRoot();
          }
        }
      }

      const tag = e.target?.tagName;
      if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT" && e.key?.toLowerCase() === "h" && state.activePage === "home") {
        model3dRuntime.dockCollapsed = !model3dRuntime.dockCollapsed;
        syncModel3DOverlayOnly();
      }
    });

    window.addEventListener("hashchange", () => {
      const next = parseHashPage();
      state.activePage = next;
      state.selectedArticleId = null;
      state.selectedActivityId = null;
      state.lightboxIdx = null;
      renderShell({ preserve3D: false });
    });

    function initApp() {
      renderShell({ preserve3D: false });
      mountCustomCursor();
      syncFacebookNewsFeed({ silent: true });
    }

    initApp();
  </script>
</body>
</html>
