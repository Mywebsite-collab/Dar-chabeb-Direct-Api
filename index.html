      const paths = SVG_PATHS[name] || "";

      return `<svg class="icon-svg ${extraClass}${spinClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getVeTargetKey(target) {
      if (!target || typeof target !== "object") return "";
      let base = "";
      switch (target.kind) {
        case "ui": base = `ui:${target.section}.${target.field}`; break;
        case "settingsField": base = `settingsField:${target.field}`; break;
        case "aboutField": base = `aboutField:${target.field}`; break;
        case "metric": base = `metric:${target.id}`; break;
        case "activity": base = `activity:${target.id}`; break;
        case "event": base = `event:${target.id}`; break;
        case "news": base = `news:${target.id}`; break;
        case "fbFeedSection": base = "fbFeedSection"; break;
        case "fbPost": base = `fbPost:${target.id}`; break;
        case "gallery": base = `gallery:${target.id}`; break;
        case "highlight": base = `highlight:${target.index}`; break;
        case "aboutValue": base = `aboutValue:${target.index}`; break;
        case "aboutOrg": base = `aboutOrg:${target.index}`; break;
        default: base = String(target.kind || "el");
      }
      return target.slot ? `${base}@${target.slot}` : base;
    }

    function veAttr(target, slot = "") {
      if (!target) return "";
      const payload = slot ? { ...target, slot } : target;
      const key = getVeTargetKey(payload);
      return ` data-ve-target="${escapeHtml(JSON.stringify(payload))}" data-ve-key="${escapeHtml(key)}"`;
    }

    function applyGlobalTextColors() {
      const tc = state?.settings?.textColors || DEFAULT_SETTINGS.textColors;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty("--color-ink", tc.ink || "#181715");
      rootStyle.setProperty("--color-ink-muted", tc.muted || "#5c5852");
      rootStyle.setProperty("--color-ink-subtle", tc.subtle || "#8b857c");
      rootStyle.setProperty("--color-gold", tc.gold || "#b08d57");
      rootStyle.setProperty("--color-on-dark", tc.onDark || "#fbf9f5");
    }

    function applyElementStyles(rootEl = document.getElementById("app-root")) {
      applyGlobalTextColors();
      if (!rootEl) return;
      const stylesMap = state?.settings?.elementStyles || {};
      const supportsTranslate = typeof CSS !== "undefined" && typeof CSS.supports === "function" ? CSS.supports("translate", "1px 1px") : true;
      rootEl.querySelectorAll("[data-ve-key]").forEach((el) => {
        const key = el.getAttribute("data-ve-key");
        const st = key ? stylesMap[key] : null;
        if (st?.color) {
          el.classList.add("ve-has-color");
          el.style.setProperty("--ve-text-color", st.color);
        } else {
          el.classList.remove("ve-has-color");
          el.style.removeProperty("--ve-text-color");
        }
        const dx = Number(st?.x) || 0;
        const dy = Number(st?.y) || 0;
        if (dx !== 0 || dy !== 0) {
          if (getComputedStyle(el).position === "static") {
            el.style.position = "relative";
          }
          el.style.zIndex = el.style.zIndex || "5";
          if (supportsTranslate) {
            el.style.translate = `${dx}px ${dy}px`;
          } else {
            el.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
          }
        } else {
          if (supportsTranslate) el.style.removeProperty("translate");
          else el.style.removeProperty("transform");
        }
      });
    }

    function safeHref(raw) {
      if (!raw || typeof raw !== "string") return "#";
      const trimmed = raw.trim();
      if (trimmed.startsWith("#")) return trimmed;
      try {
        const u = new URL(trimmed);
        return u.protocol === "https:" || u.protocol === "http:" ? u.href : "#";
      } catch {
        return "#";
      }
    }

    function resolveAssetUrl(path) {
      if (!path || typeof path !== "string") return "";
      const clean = path.trim();
      if (clean.startsWith("/src/assets/images/")) {
        return "./images/" + clean.slice("/src/assets/images/".length);
      }
      if (clean.startsWith("src/assets/images/")) {
        return "./images/" + clean.slice("src/assets/images/".length);
      }
      if (clean.startsWith("images/")) {
        return "./" + clean;
      }
      if (window.location.protocol !== "file:" && /^https:\/\/[^/]*(?:fbcdn\.net|fbsbx\.com)\//i.test(clean)) {
        return `/api/fb-image?url=${encodeURIComponent(clean)}`;
      }
      return clean;
    }

    function deepMergeDefaults(defaults, saved) {
      if (Array.isArray(defaults)) {
        return Array.isArray(saved) ? saved : structuredClone(defaults);
      }
      if (defaults && typeof defaults === "object") {
        if (!saved || typeof saved !== "object" || Array.isArray(saved)) {
          return structuredClone(defaults);
        }
        const out = structuredClone(defaults);
        for (const key of Object.keys(saved)) {
          if (key in defaults && defaults[key] && typeof defaults[key] === "object" && !Array.isArray(defaults[key])) {
            out[key] = deepMergeDefaults(defaults[key], saved[key]);
          } else {
            out[key] = saved[key];
          }
        }
        return out;
      }
      return saved ?? defaults;
    }

    function readLocalJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return structuredClone(fallback);
        const parsed = JSON.parse(raw);
        if (Array.isArray(fallback)) {
          return Array.isArray(parsed) ? parsed : structuredClone(fallback);
        }
        if (fallback && typeof fallback === "object") {
          return parsed && typeof parsed === "object" && !Array.isArray(parsed)
            ? deepMergeDefaults(fallback, parsed)
            : structuredClone(fallback);
        }
        return parsed;
      } catch {
        return structuredClone(fallback);
      }
    }

    function writeLocalJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch {
        return false;
      }
    }

    function removeLocalKeys(keys) {
      try {
        for (const key of keys) localStorage.removeItem(key);
      } catch {
        // Ignore privacy restrictions
      }
    }

    function getGeminiApiKey() {
      try {
        return (localStorage.getItem(GEMINI_KEY_STORAGE) || "").trim();

    function setGeminiApiKey(nextKey) {
      try {
        const trimmed = (nextKey || "").trim();
        if (!trimmed) localStorage.removeItem(GEMINI_KEY_STORAGE);
        else localStorage.setItem(GEMINI_KEY_STORAGE, trimmed);
      } catch {
        // Ignore privacy restrictions
      }
    }

    function getFbToken() {

    function setFbToken(nextToken) {

    function loadInitialSettings() {
      const s = readLocalJson("mjm_settings", DEFAULT_SETTINGS);
      if (Array.isArray(s?.contact?.socialLinks) && s.contact.socialLinks[0]?.url === "#social-facebook") {
        s.contact.socialLinks[0].url = "https://www.facebook.com/mjmesra";
      }
      if (!s.facebookFeed) {
        s.facebookFeed = structuredClone(DEFAULT_SETTINGS.facebookFeed);
      } else if (!s.facebookFeed.pageUrl) {
        s.facebookFeed.pageUrl = "https://www.facebook.com/mjmesra";
      }
      if (!s.model3d || (s.model3d.sourceType === "none" && !s.model3d.url)) {
        s.model3d = structuredClone(DEFAULT_SETTINGS.model3d);
      }
      return s;
    }

    function extractFacebookSlug(pageUrl) {
      try {
        const u = new URL(pageUrl || "https://www.facebook.com/mjmesra");
        const seg = u.pathname.split("/").filter(Boolean)[0];
        if (!seg || seg === "profile.php") return "mjmesra";
        return seg;
      } catch {
        return "mjmesra";
      }
    }

    function buildFacebookPluginUrl(pageUrl, { width = 500, height = 520, smallHeader = true } = {}) {
      const target = safeHref(pageUrl || "https://www.facebook.com/mjmesra");
      const finalUrl = target.startsWith("http") ? target : "https://www.facebook.com/mjmesra";
      return `https://www.facebook.com/plugins/page.php?href=${encodeURIComponent(finalUrl)}&tabs=timeline&width=${width}&height=${height}&small_header=${smallHeader ? "true" : "false"}&adapt_container_width=true&hide_cover=true&show_facepile=false`;
    }

    function stripHtmlText(html) {
      if (!html || typeof html !== "string") return "";
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      return (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
    }

    function normalizeFacebookPostToNews(raw, fallbackPageUrl) {
      const rawText = stripHtmlText(raw.fullText || raw.message || raw.content_text || raw.content_html || raw.description || raw.title || "");
      const titleRaw = stripHtmlText(raw.title || "");
      const headline =
        titleRaw && titleRaw.length >= 6 && titleRaw !== rawText
          ? titleRaw.slice(0, 120)
          : (rawText.split(/[\n.!؟]/)[0] || "منشور من الصفحة الرسمية لدار الشباب").trim().slice(0, 110);
      const summary = rawText ? (rawText.length > 170 ? `${rawText.slice(0, 167)}...` : rawText) : headline;
      const fullBody = rawText || headline;
      const parsedDate = raw.date ? new Date(raw.date) : null;
      const isoDate = parsedDate && !Number.isNaN(parsedDate.getTime()) ? parsedDate.toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10);
      const safeId = String(raw.id || `${isoDate}-${headline.slice(0, 20)}`).replace(/[^a-zA-Z0-9_-]/g, "_");
      const extUrl = safeHref(raw.url || fallbackPageUrl || "https://www.facebook.com/mjmesra");
      const img = raw.image && /^https?:\/\//i.test(raw.image) ? raw.image : "/src/assets/images/event_cultural_forum_1794615114219.jpg";
      return {
        id: `fb-${safeId}`,
        isFacebookPost: true,
        externalUrl: extUrl.startsWith("http") ? extUrl : "https://www.facebook.com/mjmesra",
        date: isoDate,
        category: { ar: "فيسبوك الرسمي", fr: "Facebook Officiel", en: "Official Facebook" },
        readTime: "Facebook",
        title: { ar: headline, fr: headline, en: headline },
        summary: { ar: summary, fr: summary, en: summary },
        body: { ar: fullBody, fr: fullBody, en: fullBody },
        image: img
      };
    }

    function updateFbNews(nextItems, meta = {}) {
      state.fbNews = Array.isArray(nextItems) ? nextItems : [];
      const cfg = state.settings?.facebookFeed || DEFAULT_SETTINGS.facebookFeed;
      const prevCache = readLocalJson(FB_CACHE_STORAGE, {});
      writeLocalJson(FB_CACHE_STORAGE, {
        syncedAt: meta.syncedAt || prevCache?.syncedAt || new Date().toISOString(),
        pageUrl: meta.pageUrl || cfg.pageUrl || "https://www.facebook.com/mjmesra",
        pageName: meta.pageName !== undefined ? meta.pageName : state.fbPageName || prevCache?.pageName || "",
        items: state.fbNews
      });
    }

    function deleteFbPostById(postId) {
      if (!postId) return;
      const next = structuredClone(state.settings);
      next.facebookFeed = { ...(next.facebookFeed || DEFAULT_SETTINGS.facebookFeed) };
      const del = new Set(Array.isArray(next.facebookFeed.deletedPostIds) ? next.facebookFeed.deletedPostIds : []);
      del.add(postId);
      next.facebookFeed.deletedPostIds = [...del];
      updateSettings(next);
      updateFbNews((Array.isArray(state.fbNews) ? state.fbNews : []).filter((p) => p.id !== postId));
      if (state.selectedArticleId === postId) state.selectedArticleId = null;
      if (state.activeVeTarget?.kind === "fbPost" && state.activeVeTarget?.id === postId) {
        state.activeVeTarget = null;
      }
    }

    function getMergedNewsList() {
      const fbCfg = state.settings?.facebookFeed || DEFAULT_SETTINGS.facebookFeed;
      if (fbCfg.enabled === false || fbCfg.autoMergeSynced === false || !Array.isArray(state.fbNews) || !state.fbNews.length) {
        return state.news;
      }
      const deletedSet = new Set(Array.isArray(fbCfg.deletedPostIds) ? fbCfg.deletedPostIds : []);
      const seen = new Set();
      const merged = [];
      for (const item of [...state.fbNews, ...state.news]) {
        if (!item || !item.id || seen.has(item.id) || deletedSet.has(item.id)) continue;
        seen.add(item.id);
        merged.push(item);
      }
      return merged;
    }

    async function syncFacebookNewsFeed({ force = false, silent = false } = {}) {
      const cfg = state.settings?.facebookFeed || DEFAULT_SETTINGS.facebookFeed;
      if (cfg.enabled === false) return { ok: false, mode: "disabled" };
      const pageUrl = cfg.pageUrl || "https://www.facebook.com/mjmesra";
      const token = getFbToken();
      const rssUrl = (cfg.rssJsonUrl || "").trim();
      const limit = Math.max(1, Math.min(20, Number(cfg.syncLimit) || 8));
      const isFileOrigin = window.location.protocol === "file:";
      const deletedSet = new Set(Array.isArray(cfg.deletedPostIds) ? cfg.deletedPostIds : []);
      const existingById = new Map((Array.isArray(state.fbNews) ? state.fbNews : []).map((it) => [it.id, it]));

      if (!token && !rssUrl && isFileOrigin) {
        const cached = readLocalJson(FB_CACHE_STORAGE, null);
        if (cached?.pageUrl === pageUrl && Array.isArray(cached.items)) {
          state.fbNews = cached.items.filter((it) => it && !deletedSet.has(it.id));
          state.fbPageName = cached.pageName || "";
        }
        if (force) {
          state.fbEmbedNonce += 1;
          state.fbSync = { loading: false, lastSyncedAt: new Date().toISOString(), error: "", mode: "embed" };
          if (!silent) renderShell({ preserve3D: state.activePage === "home" });
        }
        return { ok: true, mode: "embed" };
      }

      const cached = readLocalJson(FB_CACHE_STORAGE, null);
      if (!force && cached?.syncedAt && Array.isArray(cached.items) && cached.items.length && cached.pageUrl === pageUrl) {
        const ageMs = Date.now() - new Date(cached.syncedAt).getTime();
        if (ageMs < 10 * 60 * 1000) {
          state.fbNews = cached.items.filter((it) => it && !deletedSet.has(it.id));
          state.fbPageName = cached.pageName || "";
          state.fbSync = { loading: false, lastSyncedAt: cached.syncedAt, error: "", mode: token ? "graph" : rssUrl ? "rss" : "direct" };
          return { ok: true, cached: true };
        }
      }

      state.fbSync = { ...state.fbSync, loading: true, error: "" };
      if (!silent) renderShell({ preserve3D: state.activePage === "home" });

      try {
        let normalized = [];
        let pageName = state.fbPageName || "";
        let mode = "direct";
        if (token) {
          mode = "graph";
          const slug = extractFacebookSlug(pageUrl);
          const endpoint = `https://graph.facebook.com/v21.0/${encodeURIComponent(slug)}/posts?fields=id,message,created_time,permalink_url,full_picture&limit=${limit}&access_token=${encodeURIComponent(token)}`;
          const res = await fetch(endpoint);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data?.error?.message || `Facebook Graph API (${res.status})`);
          }
          const rows = Array.isArray(data?.data) ? data.data : [];
          normalized = rows
            .filter((r) => r && (r.message || r.full_picture))
            .map((r) =>
              normalizeFacebookPostToNews(
                {
                  id: r.id,
                  message: r.message || "",
                  date: r.created_time,
                  url: r.permalink_url || pageUrl,
                  image: r.full_picture || ""
                },
                pageUrl
              )
            );
        } else if (rssUrl) {
          mode = "rss";
          const res = await fetch(rssUrl, { headers: { Accept: "application/json" } });
          if (!res.ok) throw new Error(`Feed HTTP ${res.status}`);
          const data = await res.json();
          const rawItems = Array.isArray(data)
            ? data
            : Array.isArray(data?.items)
              ? data.items
              : Array.isArray(data?.data)
                ? data.data
                : Array.isArray(data?.posts)
                  ? data.posts
                  : [];
          normalized = rawItems.slice(0, limit).map((it) =>
            normalizeFacebookPostToNews(
              {
                id: it.id || it.guid || it.url || it.link,
                title: it.title || "",
                fullText: it.content_text || it.content_html || it.description || it.message || it.content || "",
                date: it.date_published || it.pubDate || it.created_time || it.date,
                url: it.url || it.link || it.permalink_url || pageUrl,
                image: it.image || it.thumbnail || it.full_picture || it.enclosure?.link || it.enclosure?.url || ""
              },
              pageUrl
            )
          );
        } else {
          mode = "direct";
          const res = await fetch(`/api/facebook-feed?url=${encodeURIComponent(pageUrl)}`);
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            throw new Error(data?.error || `Facebook page fetch (${res.status})`);
          }
          if (data.pageName) pageName = data.pageName;
          const rows = Array.isArray(data.posts) ? data.posts : [];
          normalized = rows
            .filter((r) => r && (r.message || r.full_picture))
            .slice(0, limit)
            .map((r) =>
              normalizeFacebookPostToNews(
                {
                  id: r.id,
                  message: r.message || "",
                  date: r.created_time,
                  url: r.permalink_url || pageUrl,
                  image: r.full_picture || ""
                },
                pageUrl
              )
            );
        }

        const mergedPosts = normalized
          .filter((item) => item && !deletedSet.has(item.id))
          .map((item) => {
            const existing = existingById.get(item.id);
            return existing?.editedLocally ? existing : item;
          });

        const nowIso = new Date().toISOString();
        state.fbPageName = pageName;
        state.fbEmbedNonce += 1;
        state.fbSync = { loading: false, lastSyncedAt: nowIso, error: "", mode };
        updateFbNews(mergedPosts, { syncedAt: nowIso, pageUrl, pageName });
      } catch (err) {
        state.fbSync = {
          ...state.fbSync,
          loading: false,
          error: err instanceof Error ? err.message : "Sync failed"
        };
      }

        const slot = document.getElementById("home-news-live-slot");
        if (slot) {
          slot.innerHTML = renderHomeNewsColumnHtml();
          applyElementStyles(slot);
          return { ok: !state.fbSync.error };
        }
      }
      renderShell({ preserve3D: state.activePage === "home" });
      return { ok: !state.fbSync.error };
    }

    function fileToOptimizedDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Failed to read file"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("Invalid image"));
          img.onload = () => {
            const maxDim = 1000;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width >= height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            if (!ctx) {
              resolve(String(reader.result));
              return;
            }
            ctx.fillStyle = "#fbf9f5";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.76));
          };
          img.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
    }

    function downloadJsonFile(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function extractGeminiText(data) {
      const parts = data?.candidates?.[0]?.content?.parts;

      if (language === "ar") {

      }
      if (language === "fr") {

      }
      return "Gemini API key is not configured. Open Studio Admin (triple-click the bottom footer bar) and enter your Gemini API key under Settings.";
    }

    async function callGeminiRest(model, payload, language) {
      const apiKey = getGeminiApiKey();
      if (!apiKey) {
        throw new Error(getMissingKeyMessage(language));
      }
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = json?.error?.message || `Gemini API error (${res.status})`;
        const lower = msg.toLowerCase();
        if (res.status === 403 || lower.includes("api_key_invalid") || lower.includes("permission")) {
          throw new Error("Gemini API key permission or validation failed. Verify your key in Studio Admin > Settings.");
        }
        if (res.status === 429 || lower.includes("resource_exhausted")) {
          throw new Error("Gemini API quota reached. Please try again shortly.");
        }
        throw new Error(msg);
      }
      return json;
    }

    async function callGeminiThink(prompt, language) {

          : language === "fr"

      const data = await callGeminiRest(

        {

              {

                }

            }

    async function callGeminiSearch(query, language) {
      const langLabel = language === "ar" ? "Arabic" : language === "fr" ? "French" : "English";
      const data = await callGeminiRest(
        "gemini-4-hydrogen",
        {
          contents: [
            {
              role: "user",
              parts: [
                {
                  text: `Answer in ${langLabel}. Focus on accurate, verified public information relevant to: ${query.trim()}`
                }
              ]
            }
          ],
          tools: [{ googleSearch: {} }]
        },
        language
      );
      const rawChunks = data?.candidates?.[0]?.groundingMetadata?.groundingChunks ?? [];
      const sources = [];
      for (const chunk of rawChunks) {
        const web = chunk?.web;
        if (web?.uri && /^https?:\/\//i.test(web.uri)) {
          sources.push({ title: web.title || web.uri, uri: web.uri });
        }
      }
      return { text: extractGeminiText(data), sources };
    }

    async function callGeminiMaps(query, language, coords) {
      const langLabel = language === "ar" ? "Arabic" : language === "fr" ? "French" : "English";
      const validLat =
        typeof coords?.lat === "number" && Number.isFinite(coords.lat) && coords.lat >= -90 && coords.lat <= 90
          ? coords.lat
          : MASRA_DEFAULT_COORDS.latitude;
      const validLng =
        typeof coords?.lng === "number" && Number.isFinite(coords.lng) && coords.lng >= -180 && coords.lng <= 180
          ? coords.lng
          : MASRA_DEFAULT_COORDS.longitude;

      const data = await callGeminiRest(
        "gemini-4-hydrogen",
        {
          contents: [
            {
              role: "user",
              parts: [
                {
                  text: `Answer in ${langLabel}. Center geographic context around Masra (Mesra), Mostaganem Province, Algeria when the user asks about local civic, cultural, educational, or sports places. User query: ${query.trim()}`
                }
              ]
            }
          ],
          tools: [{ googleMaps: {} }],
          toolConfig: {
            retrievalConfig: {
              latLng: { latitude: validLat, longitude: validLng }
            }
          }
        },
        language
      );

      const rawChunks = data?.candidates?.[0]?.groundingMetadata?.groundingChunks ?? [];
      const seen = new Set();
      const places = [];
      for (const chunk of rawChunks) {
        const maps = chunk?.maps;
        if (!maps?.uri || !/^https?:\/\//i.test(maps.uri) || seen.has(maps.uri)) continue;
        seen.add(maps.uri);
        const rawSnippets = maps.placeAnswerSources?.reviewSnippets ?? [];
        const snippets = rawSnippets
          .map((s) => (typeof s === "string" ? s : s?.review || s?.text || ""))
          .filter((s) => Boolean(s && s.trim()));
        places.push({ title: maps.title || maps.uri, uri: maps.uri, snippets });
      }
      return { text: extractGeminiText(data), places };
    }

    function upsertMeta(selector, attrName, attrValue, content) {
      let el = document.head.querySelector(selector);
      if (!el) {
        el = document.createElement("meta");
        el.setAttribute(attrName, attrValue);
        document.head.appendChild(el);
      }
      el.setAttribute("content", content);
    }

      const descriptionByLang = {

        fr: "Découvrez les ateliers culturels, artistiques, scientifiques, la visionneuse 3D (.glb) et les événements de la Maison de Jeunes de Masra.",
        en: "Discover cultural, artistic, scientific, and robotics workshops, custom 3D GLB viewer, and events at Maison de Jeunes de Masra."
      };
      const description = descriptionByLang[language];
      const canonicalUrl = `${window.location.href.split("#")[0]}${activePage === "home" ? "#/" : "#/" + activePage}`;

    function mountCustomCursor() {
      const dot = document.getElementById("custom-cursor");
      if (!dot) return;
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!finePointer || reducedMotion) return;

      dot.style.display = "block";
      let targetX = -100, targetY = -100, currentX = -100, currentY = -100;
      let hovering = false, lastTarget = null, rafId = 0, active = false;

      const scheduleTick = () => {
        if (active) return;
        active = true;
        rafId = requestAnimationFrame(tick);
      };

      const tick = () => {
        const dx = targetX - currentX;
        const dy = targetY - currentY;
        currentX += dx * 0.28;
        currentY += dy * 0.28;
        const settled = Math.abs(dx) < 0.15 && Math.abs(dy) < 0.15;
        if (settled) {
          currentX = targetX;
          currentY = targetY;
        }
        const scale = hovering ? 1.65 : 1;
        dot.style.transform = `translate3d(${currentX - 14}px, ${currentY - 14}px, 0) scale(${scale})`;
        dot.style.opacity = targetX < 0 ? "0" : "1";
        if (settled) {
          active = false;
          rafId = 0;
        } else {
          rafId = requestAnimationFrame(tick);
        }
      };

      window.addEventListener("pointermove", (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
        if (e.target !== lastTarget) {
          lastTarget = e.target;
          const el = e.target;
          hovering = Boolean(el?.closest?.("a, button, input, textarea, select, [role='button']"));
        }
        scheduleTick();
      }, { passive: true });

      const hideDot = () => {
        targetX = -100;
        targetY = -100;
        hovering = false;
        lastTarget = null;
        dot.style.opacity = "0";
      };
      document.addEventListener("pointerleave", hideDot, { passive: true });
      window.addEventListener("pointercancel", hideDot, { passive: true });
    }

    function initAnimatedCounters() {
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const els = document.querySelectorAll("[data-counter-target]");
      if (!els.length) return;
      if (reduced) {
        els.forEach((el) => {
          el.textContent = el.getAttribute("data-counter-target") + (el.getAttribute("data-counter-suffix") || "");
        });
        return;
      }
      const obs = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          const node = entry.target;
          if (node.dataset.counted === "1") continue;
          node.dataset.counted = "1";
          obs.unobserve(node);
          const target = Number(node.getAttribute("data-counter-target") || "0");
          const suffix = node.getAttribute("data-counter-suffix") || "";
          const start = performance.now();
          const duration = 700;
          const step = (now) => {
            const p = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - p, 3);
            node.textContent = Math.round(eased * target) + suffix;
            if (p < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        }
      }, { threshold: 0.3 });
      els.forEach((el) => obs.observe(el));
    }

    function initRevealObserver() {
      const sections = document.querySelectorAll(".reveal-section");
      if (!sections.length) return;
      const obs = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            obs.unobserve(entry.target);
          }
        }
      }, { threshold: 0.01 });
      sections.forEach((s) => obs.observe(s));
    }

    // =========================================================================
    // CUSTOM 3D GLB MODEL VIEWER + INDEXEDDB STORAGE (Three.js + GLTFLoader)
    // =========================================================================
    const GLB_DB_NAME = "mjm_3d_assets";
    const GLB_STORE_NAME = "models";
    const GLB_KEY = "custom_glb";

    function openGlbDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const req = indexedDB.open(GLB_DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(GLB_STORE_NAME)) {
            db.createObjectStore(GLB_STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error("Failed to open IndexedDB"));
      });
    }

    async function saveGlbToDb(arrayBuffer, meta) {
      const db = await openGlbDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(GLB_STORE_NAME, "readwrite");
        tx.objectStore(GLB_STORE_NAME).put({ buffer: arrayBuffer, meta }, GLB_KEY);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error); };
      });
    }

    async function loadGlbFromDb() {
      try {
        const db = await openGlbDb();
        return await new Promise((resolve) => {
          const tx = db.transaction(GLB_STORE_NAME, "readonly");
          const req = tx.objectStore(GLB_STORE_NAME).get(GLB_KEY);
          req.onsuccess = () => { db.close(); resolve(req.result || null); };
          req.onerror = () => { db.close(); resolve(null); };
        });
      } catch {
        return null;
      }
    }

    async function clearGlbFromDb() {
      try {
        const db = await openGlbDb();
        await new Promise((resolve) => {
          const tx = db.transaction(GLB_STORE_NAME, "readwrite");
          tx.objectStore(GLB_STORE_NAME).delete(GLB_KEY);
          tx.oncomplete = () => { db.close(); resolve(); };
          tx.onerror = () => { db.close(); resolve(); };
        });
      } catch {
        // Ignore
      }
    }

    const model3dRuntime = {
      mountSeq: 0,
      cleanup: null,
      dockCollapsed: false,
      settingsOpen: false,
      touchOrbitActive: false,
      hasTouch: window.matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0,
      webglError: false,
      loading: false,
      loadError: "",
      hasModel: false,
      hasAnimations: false,
      setTouchOrbit: null,
      applyVisualSettings: null,
      loadCurrentModel: null,
      resetCamera: null,
      zoomBy: null,
      rotateStep: null
    };

    function isSoftwareRendererContext(gl) {
      try {
        if (!gl) return true;
        const ext = gl.getExtension("WEBGL_debug_renderer_info");
        const param = ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER;
        const gpu = String(gl.getParameter(param) || "");
        return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
      } catch {
        return false;
      }
    }

    async function importThreeModules() {
      try {
        const [threeMod, orbitMod, envMod, gltfMod, dracoMod] = await Promise.all([
          import("three"),
          import("three/addons/controls/OrbitControls.js"),
          import("three/addons/environments/RoomEnvironment.js"),
          import("three/addons/loaders/GLTFLoader.js"),
          import("three/addons/loaders/DRACOLoader.js").catch(() => null)
        ]);
        return { THREE: threeMod, OrbitControls: orbitMod.OrbitControls, RoomEnvironment: envMod.RoomEnvironment, GLTFLoader: gltfMod.GLTFLoader, DRACOLoader: dracoMod?.DRACOLoader || null };
      } catch {
        const bases = [
          "https://esm.sh/three@0.172.0",
          "https://cdn.jsdelivr.net/npm/three@0.172.0",
          "https://unpkg.com/three@0.172.0"
        ];
        let lastErr = null;
        for (const base of bases) {
          try {
            const coreUrl = base.includes("esm.sh") ? base : `${base}/build/three.module.js`;
            const [threeMod, orbitMod, envMod, gltfMod, dracoMod] = await Promise.all([
              import(coreUrl),
              import(`${base}/examples/jsm/controls/OrbitControls.js`),
              import(`${base}/examples/jsm/environments/RoomEnvironment.js`),
              import(`${base}/examples/jsm/loaders/GLTFLoader.js`),
              import(`${base}/examples/jsm/loaders/DRACOLoader.js`).catch(() => null)
            ]);
            return { THREE: threeMod, OrbitControls: orbitMod.OrbitControls, RoomEnvironment: envMod.RoomEnvironment, GLTFLoader: gltfMod.GLTFLoader, DRACOLoader: dracoMod?.DRACOLoader || null };
          } catch (err) {
            lastErr = err;
          }
        }
        throw lastErr || new Error("Unable to load Three.js engine");
      }
    }

    function disposeObject3D(rootObj) {
      if (!rootObj) return;
      rootObj.traverse((obj) => {
        if (obj.isMesh) {
          obj.geometry?.dispose();
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => {
            if (!m) return;
            for (const key of Object.keys(m)) {
              const v = m[key];
              if (v && v.isTexture) v.dispose();
            }
            m.dispose();
          });
        }
      });
    }

    async function mountModel3D(container, onStateSync) {
      if (!container) return;
      const mySeq = ++model3dRuntime.mountSeq;
      if (model3dRuntime.cleanup) {
        model3dRuntime.cleanup();
        model3dRuntime.cleanup = null;
      }

      let THREE, OrbitControls, RoomEnvironment, GLTFLoader, DRACOLoader;
      try {
        ({ THREE, OrbitControls, RoomEnvironment, GLTFLoader, DRACOLoader } = await importThreeModules());
      } catch {
        if (mySeq !== model3dRuntime.mountSeq) return;
        model3dRuntime.webglError = true;
        onStateSync();
        return;
      }

      if (mySeq !== model3dRuntime.mountSeq || !container.isConnected) return;

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: "default",
          failIfMajorPerformanceCaveat: false,
          alpha: false,
          preserveDrawingBuffer: true
        });
      } catch {
        try {
          renderer = new THREE.WebGLRenderer({
            antialias: false,
            powerPreference: "default",
            failIfMajorPerformanceCaveat: false,
            alpha: false
          });
        } catch {
          model3dRuntime.webglError = true;
          onStateSync();
          return;
        }
      }

      const isSoftwareGl = isSoftwareRendererContext(renderer.getContext());
      model3dRuntime.webglError = false;
      const width = container.clientWidth || container.parentElement?.clientWidth || window.innerWidth || 960;
      const height = container.clientHeight || container.parentElement?.clientHeight || 560;

      renderer.setSize(width, height, false);
      renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio || 1, 1.75));
      if ("outputColorSpace" in renderer && THREE.SRGBColorSpace) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
      }
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = Number(state.settings.model3d?.exposure) || 1.15;
      renderer.shadowMap.enabled = !isSoftwareGl;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.domElement.style.width = "100%";
      renderer.domElement.style.height = "100%";
      renderer.domElement.style.display = "block";

      container.innerHTML = "";
      container.appendChild(renderer.domElement);

      const onContextLost = (e) => {
        e.preventDefault();
        model3dRuntime.webglError = true;
        onStateSync();
      };
      const onContextRestored = () => {
        model3dRuntime.webglError = false;
        handleResize();
        resetCamera();
        resumeIfActive();
        onStateSync();
      };
      renderer.domElement.addEventListener("webglcontextlost", onContextLost);
      renderer.domElement.addEventListener("webglcontextrestored", onContextRestored);

      const scene = new THREE.Scene();
      const BG_COLORS = { dark: 0x13151a, studio: 0x262421, light: 0xebe6df };
      scene.background = new THREE.Color(BG_COLORS[state.settings.model3d?.bgTheme] || BG_COLORS.dark);

      let envTex = null;
      try {
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        envTex = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.environment = envTex;
        pmremGenerator.dispose();
      } catch {
        // Fallback smoothly to scene lights when PMREM half-float isn't supported
      }

      const camera = new THREE.PerspectiveCamera(42, Math.max(0.2, width / Math.max(1, height)), 0.05, 200);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = !isSoftwareGl;
      controls.dampingFactor = 0.06;
      controls.enableRotate = true;
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.minDistance = 0.8;
      controls.maxDistance = 18;
      controls.maxPolarAngle = Math.PI * 0.88;
      controls.minPolarAngle = 0.1;
      controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

      const applyTouchAction = () => {
        renderer.domElement.style.touchAction = model3dRuntime.touchOrbitActive ? "none" : "pan-y";
      };
      applyTouchAction();

      model3dRuntime.setTouchOrbit = (val) => {
        model3dRuntime.touchOrbitActive = Boolean(val);
        applyTouchAction();
        onStateSync();
      };

      let tapCandidate = null;
      const onPointerDownCapture = (e) => {
        if (e.pointerType !== "touch") return;
        if (!model3dRuntime.hasTouch) {
          model3dRuntime.hasTouch = true;
          onStateSync();
        }
        if (!model3dRuntime.touchOrbitActive) {
          e.stopImmediatePropagation();
          tapCandidate = { x: e.clientX, y: e.clientY, time: performance.now(), id: e.pointerId };
        }
      };
      const onPointerUpCapture = (e) => {
        if (!tapCandidate || e.pointerId !== tapCandidate.id) return;
        const dx = Math.abs(e.clientX - tapCandidate.x);
        const dy = Math.abs(e.clientY - tapCandidate.y);
        const elapsed = performance.now() - tapCandidate.time;
        tapCandidate = null;
        if (dx < 10 && dy < 10 && elapsed < 260) {
          model3dRuntime.setTouchOrbit(true);
        }
      };
      const onPointerCancelCapture = () => { tapCandidate = null; };
      renderer.domElement.addEventListener("pointerdown", onPointerDownCapture, { capture: true });
      renderer.domElement.addEventListener("pointerup", onPointerUpCapture, { capture: true });
      renderer.domElement.addEventListener("pointercancel", onPointerCancelCapture, { capture: true });

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3b352e, 0.95);
      scene.add(hemiLight);

      const keyLight = new THREE.DirectionalLight(0xfff4e6, 2.0);
      keyLight.position.set(5, 8, 6);
      keyLight.castShadow = !isSoftwareGl;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xc2d6f0, 0.85);
      fillLight.position.set(-6, 4, -5);
      scene.add(fillLight);

      const modelPivot = new THREE.Group();
      scene.add(modelPivot);

      let loadedScene = null;
      let mixer = null;
      let activeClips = [];
      let disposed = false;

      const loader = new GLTFLoader();
      loader.setCrossOrigin("anonymous");
      let dracoLoader = null;
      if (DRACOLoader) {
        dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
        loader.setDRACOLoader(dracoLoader);
      }

      const applyVisualSettings = () => {
        const cfg = state.settings.model3d || DEFAULT_SETTINGS.model3d;
        const s = Math.max(0.15, Math.min(4, Number(cfg.scale) || 1));
        const oy = Math.max(-3, Math.min(3, Number(cfg.offsetY) || 0));
        const exp = Math.max(0.2, Math.min(3, Number(cfg.exposure) || 1.15));
        const spd = Math.max(0, Math.min(8, Number(cfg.rotateSpeed) ?? 1.5));

        modelPivot.scale.setScalar(s);
        modelPivot.position.y = oy;
        renderer.toneMappingExposure = exp;
        scene.background = new THREE.Color(BG_COLORS[cfg.bgTheme] || BG_COLORS.dark);
        controls.autoRotate = Boolean(cfg.autoRotate) && model3dRuntime.hasModel;
        controls.autoRotateSpeed = spd;

        const sectionEl = document.getElementById("model-3d");
        if (sectionEl) {
          sectionEl.classList.remove("theme-dark", "theme-studio", "theme-light");
          sectionEl.classList.add(`theme-${cfg.bgTheme || "dark"}`);
        }

        if (activeClips.length) {
          activeClips.forEach((act) => {
            act.paused = !cfg.playAnimations;
          });
        }
      };

      const getFittedDistance = () => {
        const vFov = THREE.MathUtils.degToRad(camera.fov);
        const aspect = Math.max(0.42, camera.aspect || 1);
        const radius = 1.95;
        const distV = radius / Math.sin(vFov / 2);
        const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
        const distH = radius / Math.sin(hFov / 2);
        return Math.max(4.6, Math.min(12.5, Math.max(distV, distH) * 1.06));
      };

      const resetCamera = () => {
        const dist = getFittedDistance();
        const dir = new THREE.Vector3(3.8, 2.1, 4.4).normalize();
        camera.position.copy(dir.multiplyScalar(dist));
        controls.target.set(0, 0, 0);
        controls.update();
        renderer.render(scene, camera);
      };

      const zoomBy = (factor) => {
        const offset = camera.position.clone().sub(controls.target);
        const nextLen = Math.max(controls.minDistance, Math.min(controls.maxDistance, offset.length() * factor));
        offset.setLength(nextLen);
        camera.position.copy(controls.target).add(offset);
        controls.update();
        renderer.render(scene, camera);
      };

      const rotateStep = (deltaAzimuth) => {
        const offset = camera.position.clone().sub(controls.target);
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), deltaAzimuth);
        camera.position.copy(controls.target).add(offset);
        controls.update();
        renderer.render(scene, camera);
      };

      const attachLoadedGltf = (gltf) => {
        if (disposed || mySeq !== model3dRuntime.mountSeq) {
          disposeObject3D(gltf.scene);
          return;
        }
        if (loadedScene) {
          modelPivot.remove(loadedScene);
          disposeObject3D(loadedScene);
          loadedScene = null;
        }
        if (mixer) {
          mixer.stopAllAction();
          mixer = null;
        }
        activeClips = [];

        const root = gltf.scene;
        root.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const normScale = 3.0 / maxDim;

        root.scale.setScalar(normScale);
        root.position.set(-center.x * normScale, -center.y * normScale, -center.z * normScale);
        root.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = !isSoftwareGl;
            obj.receiveShadow = !isSoftwareGl;
          }
        });

        modelPivot.add(root);
        loadedScene = root;

        if (Array.isArray(gltf.animations) && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(root);
          activeClips = gltf.animations.map((clip) => {
            const action = mixer.clipAction(clip);
            action.play();
            return action;
          });
          model3dRuntime.hasAnimations = true;
        } else {
          model3dRuntime.hasAnimations = false;
        }

        model3dRuntime.hasModel = true;
        model3dRuntime.loading = false;
        model3dRuntime.loadError = "";
        handleResize();
        resetCamera();
        applyVisualSettings();
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(() => {
          if (!disposed && mySeq === model3dRuntime.mountSeq) renderer.render(scene, camera);
        });
        onStateSync();
        resumeIfActive();
      };

      const loadCurrentModel = async () => {
        if (disposed || mySeq !== model3dRuntime.mountSeq) return;
        const cfg = state.settings.model3d || DEFAULT_SETTINGS.model3d;
        const activeSourceType = cfg.sourceType && cfg.sourceType !== "none" ? cfg.sourceType : "url";
        const activeUrl = cfg.url || DEFAULT_SETTINGS.model3d.url;

        if (activeSourceType === "none" || (activeSourceType === "url" && !activeUrl)) {
          if (loadedScene) {
            modelPivot.remove(loadedScene);
            disposeObject3D(loadedScene);
            loadedScene = null;
          }
          if (mixer) {
            mixer.stopAllAction();
            mixer = null;
          }
          activeClips = [];
          model3dRuntime.hasModel = false;
          model3dRuntime.hasAnimations = false;
          model3dRuntime.loading = false;
          model3dRuntime.loadError = "";
          applyVisualSettings();
          onStateSync();
          return;
        }

        model3dRuntime.loading = true;
        model3dRuntime.loadError = "";
        onStateSync();

        try {
          if (activeSourceType === "indexeddb") {
            const record = await loadGlbFromDb();
            if (disposed || mySeq !== model3dRuntime.mountSeq) return;
            if (!record?.buffer) {
              model3dRuntime.loading = false;
              model3dRuntime.hasModel = false;
              model3dRuntime.loadError = state.language === "ar" ? "تعذر العثور على ملف المجسم المحفوظ." : "Stored .glb file not found.";
              onStateSync();
              return;
            }
            loader.parse(
              record.buffer,
              "",
              (gltf) => attachLoadedGltf(gltf),
              (err) => {
                if (disposed || mySeq !== model3dRuntime.mountSeq) return;
                model3dRuntime.loading = false;
                model3dRuntime.hasModel = false;
                model3dRuntime.loadError = err?.message || "Invalid GLB/GLTF binary.";
                onStateSync();
              }
            );
          } else if (activeSourceType === "url" && activeUrl) {
            const isFileOrigin = window.location.protocol === "file:";
            const localBundled = "./images/model.glb";
            const candidates = [];
            if (!isFileOrigin && activeUrl === DEFAULT_SETTINGS.model3d.url) {
              candidates.push(localBundled, activeUrl);
            } else if (!isFileOrigin) {
              candidates.push(activeUrl, localBundled);
            } else {
              candidates.push(activeUrl);
            }

            const tryLoadIdx = (idx, lastErr) => {
              if (disposed || mySeq !== model3dRuntime.mountSeq) return;
              if (idx >= candidates.length) {
                model3dRuntime.loading = false;
                model3dRuntime.hasModel = false;
                model3dRuntime.loadError = lastErr?.message || "Failed to load GLB model.";
                onStateSync();
                return;
              }
              loader.load(
                candidates[idx],
                (gltf) => attachLoadedGltf(gltf),
                undefined,
                (err) => tryLoadIdx(idx + 1, err || lastErr)
              );
            };
            tryLoadIdx(0, null);
          }
        } catch (err) {
          if (disposed || mySeq !== model3dRuntime.mountSeq) return;
          model3dRuntime.loading = false;
          model3dRuntime.hasModel = false;
          model3dRuntime.loadError = err instanceof Error ? err.message : "Failed to load 3D model.";
          onStateSync();
        }
      };

      model3dRuntime.applyVisualSettings = applyVisualSettings;
      model3dRuntime.loadCurrentModel = loadCurrentModel;
      model3dRuntime.resetCamera = resetCamera;
      model3dRuntime.zoomBy = zoomBy;
      model3dRuntime.rotateStep = rotateStep;

      const handleResize = () => {
        if (!container) return;
        const w = container.clientWidth || container.parentElement?.clientWidth || window.innerWidth;
        const h = container.clientHeight || container.parentElement?.clientHeight || 560;
        if (w <= 0 || h <= 0) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
        renderer.render(scene, camera);
      };

      let frameId = 0;
      let prevTs = performance.now();
      let inViewport = true;
      let tabVisible = !document.hidden;
      const isActive = () => !disposed && inViewport && tabVisible;

      const tick = (ts) => {
        if (!isActive()) {
          frameId = 0;
          return;
        }
        frameId = requestAnimationFrame(tick);
        const dt = Math.min(0.05, Math.max(0, (ts - prevTs) / 1000));
        prevTs = ts;
        if (mixer) mixer.update(dt);
        controls.update();
        renderer.render(scene, camera);
      };

      const resumeIfActive = () => {
        if (isActive() && !frameId) {
          prevTs = performance.now();
          frameId = requestAnimationFrame(tick);
        }
      };

      const pauseLoop = () => {
        if (frameId) {
          cancelAnimationFrame(frameId);
          frameId = 0;
        }
      };

      const onVisibilityChange = () => {
        tabVisible = !document.hidden;
        if (tabVisible) resumeIfActive();
        else pauseLoop();
      };
      document.addEventListener("visibilitychange", onVisibilityChange);

      const visibilityObserver = new IntersectionObserver(
        (entries) => {
          const visibleNow = Boolean(entries[0]?.isIntersecting);
          if (visibleNow !== inViewport) {
            inViewport = visibleNow;
            if (inViewport) resumeIfActive();
            else {
              pauseLoop();
              if (model3dRuntime.touchOrbitActive) model3dRuntime.setTouchOrbit(false);
            }
          }
        },
        { threshold: 0 }
      );
      visibilityObserver.observe(container);

      applyVisualSettings();
      resetCamera();
      loadCurrentModel();
      tick(performance.now());

      const resizeObserver = new ResizeObserver(handleResize);
      resizeObserver.observe(container);
      window.addEventListener("resize", handleResize);

      model3dRuntime.cleanup = () => {
        disposed = true;
        inViewport = false;
        tabVisible = false;
        model3dRuntime.setTouchOrbit = null;
        model3dRuntime.applyVisualSettings = null;
        model3dRuntime.loadCurrentModel = null;
        model3dRuntime.resetCamera = null;
        model3dRuntime.zoomBy = null;
        model3dRuntime.rotateStep = null;
        document.removeEventListener("visibilitychange", onVisibilityChange);
        visibilityObserver.disconnect();
        resizeObserver.disconnect();
        pauseLoop();
        window.removeEventListener("resize", handleResize);
        renderer.domElement.removeEventListener("pointerdown", onPointerDownCapture, { capture: true });
        renderer.domElement.removeEventListener("pointerup", onPointerUpCapture, { capture: true });
        renderer.domElement.removeEventListener("pointercancel", onPointerCancelCapture, { capture: true });
        renderer.domElement.removeEventListener("webglcontextlost", onContextLost);
        renderer.domElement.removeEventListener("webglcontextrestored", onContextRestored);
        controls.dispose();
        if (mixer) mixer.stopAllAction();
        disposeObject3D(scene);
        dracoLoader?.dispose();
        envTex?.dispose();
        renderer.dispose();
        if (renderer.domElement.parentNode === container) container.removeChild(renderer.domElement);
      };
    }

    async function handleGlbFileUpload(file) {
      if (!file) return;
      const lower = (file.name || "").toLowerCase();
      if (!lower.endsWith(".glb") && !lower.endsWith(".gltf")) {
        model3dRuntime.loadError =
          state.language === "ar"
            ? "يرجى اختيار ملف بصيغة .glb أو .gltf فقط."
            : state.language === "fr"
              ? "Veuillez sélectionner uniquement un fichier .glb ou .gltf."
              : "Please select a .glb or .gltf file only.";
        syncModel3DOverlayOnly();
        return;
      }
      try {
        model3dRuntime.loading = true;
        model3dRuntime.loadError = "";
        syncModel3DOverlayOnly();
        const buf = await file.arrayBuffer();
        await saveGlbToDb(buf, { fileName: file.name, fileSize: file.size });
        const next = structuredClone(state.settings);
        next.model3d = {
          ...(next.model3d || DEFAULT_SETTINGS.model3d),
          sourceType: "indexeddb",
          fileName: file.name,
          fileSize: file.size,
          url: ""
        };
        updateSettings(next);
        if (model3dRuntime.loadCurrentModel) {
          await model3dRuntime.loadCurrentModel();
        } else {
          model3dRuntime.loading = false;
        }
        if (state.activePage === "admin") {
          flashAdminSaved();
          renderShell({ preserve3D: false });
        }
      } catch (err) {
        model3dRuntime.loading = false;
        model3dRuntime.loadError = err instanceof Error ? err.message : "Failed to store .glb file.";
        syncModel3DOverlayOnly();
      }
    }

    async function loadGlbFromUrl(rawUrl) {
      const url = (rawUrl || "").trim();
      if (!url) return;
      const next = structuredClone(state.settings);
      next.model3d = {
        ...(next.model3d || DEFAULT_SETTINGS.model3d),
        sourceType: "url",
        url,
        fileName: url.split("/").pop()?.split("?")[0] || "model.glb",
        fileSize: 0
      };
      updateSettings(next);
      if (model3dRuntime.loadCurrentModel) {
        await model3dRuntime.loadCurrentModel();
      }
      if (state.activePage === "admin") {
        flashAdminSaved();
        renderShell({ preserve3D: false });
      }
    }

                            ${isOpen ? icon("chevronUp", "icon-sm") : icon("chevronDown", "icon-sm")}

                          <button type="button" data-action="delete-item" data-kind="activities" data-id="${escapeHtml(act.id)}" class="btn" style="padding:0.375rem 0.75rem;border:1px solid rgba(154,52,18,0.25);color:#9a3412;">
                            ${icon("trash", "icon-sm")}
                            <span>${escapeHtml(t.deleteBtn)}</span>

                        </div>
                      </div>
                      ${
                        isOpen
                          ? `<div class="card-surface p-card stack-md" style="padding:1rem;">
                              <div class="grid-2" style="gap:0.75rem;">
                                <label class="stack-xs" style="font-size:0.75rem;"><span class="text-muted">Category Key</span>

                                <label class="stack-xs" style="font-size:0.75rem;"><span class="text-muted">Mentor / Facilitator</span><input type="text" value="${escapeHtml(act.mentor)}" data-bind="activities.${idx}.mentor" class="input-field" /></label>
                              </div>
                              ${renderLocalizedFieldGrid("Category", act.category, { bindPrefix: `activities.${idx}.category` })}
                              ${renderLocalizedFieldGrid("Title", act.title, { bindPrefix: `activities.${idx}.title` })}
                              ${renderLocalizedFieldGrid("Summary", act.summary, { multiline: true, bindPrefix: `activities.${idx}.summary` })}
                              ${renderLocalizedFieldGrid("Details", act.details, { multiline: true, rows: 3, bindPrefix: `activities.${idx}.details` })}
                              ${renderLocalizedFieldGrid("Schedule", act.schedule, { bindPrefix: `activities.${idx}.schedule` })}
                              ${renderLocalizedFieldGrid("Space", act.space, { bindPrefix: `activities.${idx}.space` })}
                            </div>`
                          : ""

                      ${renderAdminImageControl({ language: lang, compact: true, value: act.image, bindKey: `activities.${idx}.image` })}
                    </div>`;
                })
                .join("")}
            </div>
          </div>
        `;
      } else if (state.adminTab === "gallery") {
        tabBody = `
          <div class="stack-lg">
            <form data-action="admin-add-gallery" class="card-surface p-card stack-md">
              <input type="text" placeholder="${escapeHtml(lang === "ar" ? "عنوان الصورة" : lang === "fr" ? "Titre de l'image" : "Image Title")}" value="${escapeHtml(state.newGallery.title)}" data-bind="newGallery.title" class="input-field" />
              ${renderAdminImageControl({ language: lang, label: imageLabel, value: state.newGallery.image, bindKey: "newGallery.image" })}
              <div><button type="submit" class="btn btn-dark">${icon("plus", "icon-svg")}<span>${escapeHtml(lang === "ar" ? "إضافة للمعرض" : lang === "fr" ? "Ajouter à la galerie" : "Add to Gallery")}</span></button></div>
            </form>

            <div class="divide-list hairline-y">
              ${state.gallery
                .map((g, idx) => {
                  const isOpen = state.expandedGalleryId === g.id;
                  return `
                    <div style="padding-block:1.25rem;" class="stack-md">
                      <div class="flex-between">
                        <div>
                          <p class="font-display heading-sm text-ink" style="margin:0;">${escapeHtml(g.title[lang])}</p>
                          <p class="text-subtle" style="font-size:0.75rem;margin:0.25rem 0 0;">${escapeHtml(g.category[lang])}</p>
                        </div>
                        <div class="flex-row-wrap" style="gap:0.5rem;">
                          <button type="button" data-action="toggle-expand" data-kind="gallery" data-id="${escapeHtml(g.id)}" class="btn-pill" style="display:inline-flex;align-items:center;gap:0.375rem;">
                            ${isOpen ? icon("chevronUp", "icon-sm") : icon("chevronDown", "icon-sm")}
                            <span>${escapeHtml(isOpen ? collapseTextLabel : editTextLabel)}</span>
                          </button>
                          <button type="button" data-action="delete-item" data-kind="gallery" data-id="${escapeHtml(g.id)}" class="btn" style="padding:0.375rem 0.75rem;border:1px solid rgba(154,52,18,0.25);color:#9a3412;">
                            ${icon("trash", "icon-sm")}
                            <span>${escapeHtml(t.deleteBtn)}</span>
                          </button>
                        </div>
                      </div>
                      ${
                        isOpen
                          ? `<div class="card-surface p-card stack-md" style="padding:1rem;">
                              <label class="stack-xs" style="font-size:0.75rem;max-width:20rem;"><span class="text-muted">Album Key</span><input type="text" value="${escapeHtml(g.categoryKey)}" data-bind="gallery.${idx}.categoryKey" class="input-field font-mono-tabular" /></label>
                              ${renderLocalizedFieldGrid("Category", g.category, { bindPrefix: `gallery.${idx}.category` })}
                              ${renderLocalizedFieldGrid("Title", g.title, { bindPrefix: `gallery.${idx}.title` })}
                              ${renderLocalizedFieldGrid("Caption", g.caption, { bindPrefix: `gallery.${idx}.caption` })}
                            </div>`
                          : ""
                      }
                      ${renderAdminImageControl({ language: lang, compact: true, value: g.image, bindKey: `gallery.${idx}.image` })}
                    </div>`;
                })
                .join("")}
            </div>
          </div>
        `;
      } else if (state.adminTab === "interface") {
        tabBody = renderInterfaceTextsEditorHtml();
      }

      return `
        <div class="container-lg section-pad-sm stack-lg">
          <header class="stack-md">
            <p class="kicker">${escapeHtml(t.kicker)}</p>
            <div class="flex-between">
              <h1 class="font-display heading-xl text-ink" style="font-size:clamp(1.875rem,4vw,3rem);">${escapeHtml(t.title)}</h1>
              <div class="flex-row-wrap" style="gap:0.5rem;">
                <button type="button" data-action="enter-visual-edit" data-page="home" class="btn btn-gold">
                  ${icon("mousePointerClick", "icon-svg")}
                  <span>${escapeHtml(lang === "ar" ? "تعديل بصري مباشر (انقر على أي عنصر)" : lang === "fr" ? "Édition Visuelle (Cliquer pour modifier)" : "Visual Click-to-Edit Mode")}</span>
                </button>
                <button type="button" data-action="export-all-json" class="btn btn-dark">
                  ${icon("download", "icon-svg")}
                  <span>${escapeHtml(t.exportJson)}</span>
                </button>
                <button type="button" data-action="reset-all" class="btn btn-outline">
                  ${icon("rotateCcw", "icon-svg")}
                  <span>${escapeHtml(t.resetDefaults)}</span>
                </button>
                <button type="button" data-action="lock-admin" class="btn" style="padding:0.625rem 1rem;background:rgba(154,52,18,0.1);border:1px solid rgba(154,52,18,0.25);color:#9a3412;">
                  ${icon("lock", "icon-svg")}
                  <span>${escapeHtml(exitLabel)}</span>
